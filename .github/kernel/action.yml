name: Build OnePlus EmberHeart Kernel

permissions:
  contents: write
  actions: write

inputs:
  ksun_branch_or_hash:
    required: true
    type: string
    default: ""
  ksu_type:
    description: 'Select KSU Type: KSU_NEXT or RSKSU'
    required: false
    type: string
    default: 'KSU_NEXT'
  evict_unused_ccache:
    description: 'Do you want to evict unused ccache?'
    required: true
    type: string
    default: 'false'
  clean_build:
    description: 'Force clean build without ccache acceleration'
    required: false
    type: string
    default: 'false'
  use_opt_patches:
    description: 'Do you want to add optimization patches in kernel?'
    required: false
    type: string
    default: 'false'
  use_susfs:
    description: 'Do you want to add susfs in kernel? (KSU_NEXT only)'
    required: false
    type: string
    default: 'false'
  susfs_commit_hash_or_branch:
    required: false
    type: string
    default: ""
  use_nomount:
    description: 'Do you want to add NoMount (hookless) in kernel? (RSKSU only)'
    required: false
    type: string
    default: 'false'
  nomount_ref:
    description: 'NoMount-Suite branch/ref'
    required: false
    type: string
    default: main
  patches_ref:
    description: 'Bouteillepleine/kernel_patches branch/ref (for NoMount/ADIOS)'
    required: false
    type: string
    default: main
  use_adios:
    description: 'Enable ADIOS I/O scheduler support'
    required: false
    type: string
    default: 'false'
  use_ntsync:
    description: 'Enable NTSync support (patch availability varies by kernel version)'
    required: false
    type: string
    default: 'false'
  use_unicode_fix:
    description: 'Enable Unicode bypass fix'
    required: false
    type: string
    default: 'false'
  use_ipv6_nat:
    description: 'Enable IPv6 NAT support'
    required: false
    type: string
    default: 'false'
  vendor_debloat:
    description: 'Comma-separated list of vendor modules to blacklist (empty = skip)'
    required: false
    type: string
    default: ''
  optimize_level:
    required: false
    type: string
    default: O2  # Choices: O2 or O3
  lto:
    required: false
    type: string
    default: Thin  # Choices: none, Thin, Full
  build_timestamp:
    description: 'Custom kernel build timestamp for uname -a (e.g. "Fri Dec 5 02:05:55 UTC 2025"). Leave empty for current time.'
    required: false
    type: string
    default: ''
  kernel_uname:
    required: false
    type: string
    default: ""
  compile_dlkm:
    description: 'Do you want to compile dlkm and vendor boot?'
    required: false
    type: string
    default: 'false'

outputs:
  kernel_version:
    value: ${{ steps.get_kernel_version.outputs.kernel_version }}
  ksun_version:
    value: ${{ steps.add_ksu.outputs.ksun_version }}
  ksun_tag:
    value: ${{ steps.add_ksu.outputs.ksun_tag }}
  susfs_version:
    value: ${{ steps.add_susfs.outputs.susfs_version }}
  nomount_version:
    value: ${{ steps.add_nomount.outputs.nomount_version }}
  kernel_sha256:
    value: ${{ steps.collect_kernel_stats.outputs.image_sha256 }}
  boot_sha256:
    value: ${{ steps.create_boot.outputs.boot_sha256 }}
  system_dlkm_sha256:
    value: ${{ steps.create_system_dlkm.outputs.system_dlkm_sha256 }}
  build_timestamp_used:
    value: ${{ steps.build_kernel.outputs.build_timestamp_used }}
  zip_name:
    value: ${{ steps.create_zip.outputs.zip_name }}
  ccache_hit_rate:
    value: ${{ steps.ccache_stats.outputs.hit_rate }}
  ccache_direct_rate:
    value: ${{ steps.ccache_stats.outputs.direct_rate }}

runs:
  using: composite
  steps:
    - name: Get Kernel Version Info
      id: get_kernel_version
      shell: bash
      run: |
        set -euo pipefail
        cd "$COMMON"
        CONFIG_FILES=("build.config.common" "build.config.constants")
        BRANCH_LINE=""
        for f in "${CONFIG_FILES[@]}"; do
          if [ -f "$f" ]; then
            l=$(grep '^[[:space:]]*BRANCH=' "$f" || true)
            if [ -n "$l" ]; then BRANCH_LINE="$l"; break; fi
          fi
        done
        if [ -z "$BRANCH_LINE" ]; then
          echo "Error: No BRANCH= found"; exit 1
        fi
        BRANCH_VALUE="${BRANCH_LINE#*=}"
        ANDROID_RELEASE="${BRANCH_VALUE%-*}"
        if [ -z "$ANDROID_RELEASE" ]; then
          echo "Could not parse android version from BRANCH=$BRANCH_VALUE"
          exit 1
        fi
        KERNEL_VERSION=$(make kernelversion)
        VERSION=$(echo $KERNEL_VERSION | cut -d'.' -f1)
        PATCHLEVEL=$(echo $KERNEL_VERSION | cut -d'.' -f2)
        SUBLEVEL=$(echo $KERNEL_VERSION | cut -d'.' -f3)
        cd "$ARTIFACTS_DIR"
        echo "$ANDROID_RELEASE-$KERNEL_VERSION" > "${MODEL}.txt"
        echo "ANDROID_RELEASE=$ANDROID_RELEASE" >> "$GITHUB_ENV"
        echo "KERNEL_VER=$VERSION.$PATCHLEVEL" >> "$GITHUB_ENV"
        echo "KERNEL_FULL_VER=$ANDROID_RELEASE-$KERNEL_VERSION" >> "$GITHUB_ENV"
        echo "TKERNEL_VER=$KERNEL_VERSION" >> "$GITHUB_ENV"
        echo "SUSFS_KERNEL_BRANCH=gki-$ANDROID_RELEASE-$VERSION.$PATCHLEVEL" >> "$GITHUB_ENV"
        echo "kernel_version=$ANDROID_RELEASE-$KERNEL_VERSION" >> "$GITHUB_OUTPUT"

    - name: Set Build Identity
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Set build user/host"
        BUILD_USER="EmberHeart"
        BUILD_HOST="OnePlus"
        echo "BUILD_USER=$BUILD_USER" >> "$GITHUB_ENV"
        echo "BUILD_HOST=$BUILD_HOST" >> "$GITHUB_ENV"
        echo "✅ Build identity: $BUILD_USER@$BUILD_HOST"
        echo "::endgroup::"

    - name: Validate KSU type
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.ksu_type }}" in
          KSU_NEXT|RSKSU) echo "✅ KSU type: ${{ inputs.ksu_type }}" ;;
          *) echo "::error::Invalid ksu_type: ${{ inputs.ksu_type }}"; exit 1 ;;
        esac
        case "${{ inputs.lto }}" in
          none|None|NONE|Thin|Full) echo "✅ LTO: ${{ inputs.lto }}" ;;
          *) echo "::error::Invalid lto: ${{ inputs.lto }}"; exit 1 ;;
        esac

    - name: Configure ccache & LTO caching
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$CCACHE_DIR"
        mkdir -p "$LDCACHE_DIR"
        ccache -o compression=false
        ccache -M 5G
        echo "ccache_start=$(date +%s)" >> "$GITHUB_ENV"

    - name: Restore ccache
      if: ${{ inputs.clean_build != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}-${{ inputs.lto }}_LTO
        restore-keys: |
          ccache-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}
          ccache-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-

    - name: Restore LTO cache
      if: ${{ inputs.lto == 'Thin' && inputs.clean_build != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.LDCACHE_DIR }}
        key: LTO-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}
        restore-keys: |
          LTO-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}
          LTO-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-

    - name: Clone AnyKernel3 and Other Dependencies
      shell: bash
      run: |
        set -euo pipefail
        echo "Cloning AnyKernel3 and other dependencies..."
        ANYKERNEL_BRANCH="gki-2.0"
        echo "Using AnyKernel3 branch: $ANYKERNEL_BRANCH"
        git clone --depth=1 https://github.com/terminal-beginner/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
        git clone --depth=1 https://github.com/WildKernels/kernel_patches.git
        git clone --depth=1 https://github.com/terminal-beginner/kernel_patches.git my_patches

    - name: Clone Bouteillepleine patches (ADIOS / NoMount)
      if: ${{ inputs.use_adios == 'true' || inputs.use_nomount == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Clone Bouteillepleine/kernel_patches"
        BOUT_REF="${{ inputs.patches_ref }}"
        [ -n "$BOUT_REF" ] || BOUT_REF="main"
        echo "Using ref: $BOUT_REF"
        for i in 1 2 3; do
          if git clone --depth=1 -b "$BOUT_REF" https://github.com/Bouteillepleine/kernel_patches.git bouton_kernel_patches 2>/dev/null; then
            break
          fi
          echo "Clone attempt $i failed, retrying..."
          rm -rf bouton_kernel_patches
          sleep 5
        done
        if [ ! -d bouton_kernel_patches ]; then
          echo "::error::Failed to clone Bouteillepleine/kernel_patches"
          exit 1
        fi
        echo "BOUTEILLE_KERNEL_PATCHES=$GITHUB_WORKSPACE/bouton_kernel_patches" >> "$GITHUB_ENV"
        echo "ADIOS_PATCHES_FOLDER=$GITHUB_WORKSPACE/bouton_kernel_patches/experimental" >> "$GITHUB_ENV"
        echo "✅ Bouteillepleine patches cloned"
        echo "::endgroup::"

    - name: Clone NoMount-Suite
      if: ${{ inputs.use_nomount == 'true' && inputs.ksu_type == 'RSKSU' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Clone NoMount-Suite"
        NM_REF="${{ inputs.nomount_ref }}"
        [ -n "$NM_REF" ] || NM_REF="main"
        echo "Using NoMount-Suite ref: $NM_REF"
        for i in 1 2 3; do
          if git clone --depth=1 -b "$NM_REF" https://github.com/Bouteillepleine/NoMount-Suite.git nomount_suite 2>/dev/null; then
            break
          fi
          echo "Clone attempt $i failed, retrying..."
          rm -rf nomount_suite
          sleep 5
        done
        if [ ! -d nomount_suite ]; then
          echo "::error::Failed to clone NoMount-Suite"
          exit 1
        fi
        echo "NOMOUNT_SUITE=$GITHUB_WORKSPACE/nomount_suite" >> "$GITHUB_ENV"
        echo "✅ NoMount-Suite cloned"
        echo "::endgroup::"

    - name: Clone susfs
      if: ${{ inputs.use_susfs == 'true' && inputs.ksu_type == 'KSU_NEXT' }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${{ inputs.susfs_commit_hash_or_branch }}" ]]; then
          SUSFS_BRANCH="${{ env.SUSFS_KERNEL_BRANCH }}"
        else
          SUSFS_BRANCH="${{ inputs.susfs_commit_hash_or_branch }}"
        fi
        echo "Using SUSFS branch: $SUSFS_BRANCH"
        git clone https://gitlab.com/simonpunk/susfs4ksu.git
        cd susfs4ksu
        if git rev-parse --verify "origin/$SUSFS_BRANCH" >/dev/null 2>&1 || git rev-parse --verify "$SUSFS_BRANCH" >/dev/null 2>&1; then
          git checkout "$SUSFS_BRANCH"
          SUSFS_COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "SUSFS_COMMIT_SHA=$SUSFS_COMMIT_SHA" >> $GITHUB_ENV
        else
          echo "Error: SUSFS branch or ref '$SUSFS_BRANCH' not found."
          exit 1
        fi

    - name: Clean Up ABI Protected Exports
      shell: bash
      run: |
        set -euo pipefail
        cd "$KERNEL_PLATFORM"
        rm -f common/android/abi_gki_protected_exports_* || true
        rm -f msm-kernel/android/abi_gki_protected_exports_* || true
        df -h

    - name: Add KernelSU (KSU_NEXT / RSKSU)
      id: add_ksu
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add KernelSU (${{ inputs.ksu_type }})"
        cd "$KERNEL_PLATFORM"

        if [ "${{ inputs.ksu_type }}" = "KSU_NEXT" ]; then
          echo "Adding KernelSU Next..."
          if [ "${{ inputs.ksun_branch_or_hash }}" = "" ]; then
            curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -
          else
            curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s "${{ inputs.ksun_branch_or_hash }}"
          fi
          git submodule update --init --recursive
          KSU_DIR_NAME="KernelSU-Next"
        else
          echo "Adding ReSukiSU..."
          RSKSU_SETUP="$(mktemp /tmp/rsksu_setup_XXXXXX.sh)"
          trap 'rm -f "$RSKSU_SETUP"' EXIT
          if ! curl --fail --location --proto '=https' --tlsv1.2 -LSs \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            -o "$RSKSU_SETUP"; then
            echo "::error::Failed to download ReSukiSU setup.sh"; exit 1
          fi
          SCRIPT_SIZE="$(stat -c%s "$RSKSU_SETUP")"
          if [ "$SCRIPT_SIZE" -lt 512 ]; then
            echo "::error::Downloaded setup.sh too small (${SCRIPT_SIZE} bytes)"; exit 1
          fi
          if ! head -n1 "$RSKSU_SETUP" | grep -q '^#!'; then
            echo "::error::Downloaded setup.sh missing shebang"; exit 1
          fi
          chmod +x "$RSKSU_SETUP"
          if [ -z "${{ inputs.ksun_branch_or_hash }}" ]; then
            bash "$RSKSU_SETUP"
          else
            bash "$RSKSU_SETUP" "${{ inputs.ksun_branch_or_hash }}"
          fi
          KSU_DIR_NAME="KernelSU"
        fi

        if [ ! -d "$KERNEL_PLATFORM/$KSU_DIR_NAME" ]; then
          echo "::error::$KSU_DIR_NAME directory not created"
          find "$KERNEL_PLATFORM" -maxdepth 3 -type d \( -iname "*ksu*" -o -iname "*resuki*" \) || true
          exit 1
        fi
        echo "KSU_DIR=$KERNEL_PLATFORM/$KSU_DIR_NAME" >> "$GITHUB_ENV"
        echo "KSU_DIR_NAME=$KSU_DIR_NAME" >> "$GITHUB_ENV"

        cd "$KERNEL_PLATFORM/$KSU_DIR_NAME/kernel"

        COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD)
        KSUN_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

        if [ "${{ inputs.ksu_type }}" = "KSU_NEXT" ]; then
          if [ $COMMITS_COUNT -lt 2684 ]; then
            BASE_VERSION=10200
          else
            BASE_VERSION=30000
          fi
          KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)
          if [ -f Makefile ]; then
            sed -i "s/DKSU_VERSION=11998/DKSU_VERSION=${KSU_VERSION}/" Makefile
          fi
          if [ -f ksu.c ]; then
            sed -i 's/#if defined(CONFIG_STACKPROTECTOR) && (defined(CONFIG_ARM64) && !defined(CONFIG_STACKPROTECTOR_PER_TASK))/#if 0/' ksu.c
          fi
          if [[ "$KSU_VERSION" -gt 33095 ]] && [[ "${{ env.KERNEL_VER }}" == "6.12" ]]; then
            sed -i 's|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include -I$(KSU_KERNEL_DIR)/include/uapi|' Kbuild || true
            sed -i 's|$(src)|$(abspath $(src))|' Kbuild || true
            sed -i 's|$(srctree)/$(src)|$(abspath $(srctree)/$(src))|' Kbuild || true
          fi
          if [ "$KSU_VERSION" -lt 12884 ]; then
            echo "NEED_HOOKS=true" >> $GITHUB_ENV
          else
            echo "NEED_HOOKS=false" >> $GITHUB_ENV
          fi
        else
          BASE_VERSION=30700
          KSU_VERSION=$((COMMITS_COUNT + BASE_VERSION))
          echo "NEED_HOOKS=false" >> $GITHUB_ENV
        fi

        cd ..
        KSUN_COMMIT_SHA=$(git rev-parse --short HEAD)
        echo "KSUN_COMMIT_SHA=${KSUN_COMMIT_SHA}" >> $GITHUB_ENV
        echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
        echo "ksun_version=${KSU_VERSION}" >> "$GITHUB_OUTPUT"
        echo "ksun_tag=${KSUN_TAG}" >> "$GITHUB_OUTPUT"
        echo "KernelSU (${{ inputs.ksu_type }}) Version: $KSU_VERSION"
        echo "KernelSU added (commit: ${KSUN_COMMIT_SHA}) ✅"

        # MTIME: normalize KSU directory mtimes for ccache consistency
        if [ -n "${MTIME_CACHE:-}" ] && [ -x "$MTIME_CACHE" ]; then
          echo "::group::MTIME -t for KSU dir"
          ( "$MTIME_CACHE" -t -d "$KERNEL_PLATFORM/$KSU_DIR_NAME" -k ksun ) || echo "::warning::MTIME set failed for KSU"
          echo "::endgroup::"
        fi

        echo "::endgroup::"

    - name: Apply SUSFS Patches (KSU_NEXT only)
      id: add_susfs
      if: ${{ inputs.use_susfs == 'true' && inputs.ksu_type == 'KSU_NEXT' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying SUSFS patches..."
        cd "$KERNEL_PLATFORM"
        cp ../../susfs4ksu/kernel_patches/50_add_susfs_in_${{ env.SUSFS_KERNEL_BRANCH }}.patch ./common/
        cp ../../susfs4ksu/kernel_patches/fs/* ./common/fs/
        cp ../../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
        cd ./KernelSU-Next
        susfs_version=$(grep '#define SUSFS_VERSION' ../common/include/linux/susfs.h | awk -F'"' '{print $2}')
        echo "SUSVER=$susfs_version" >> $GITHUB_ENV
        echo "susfs_version=${susfs_version:-unknown}" >> "$GITHUB_OUTPUT"
        echo "SuSFS Version: $susfs_version"
        cd ../
        version_lte() {
          [ "$(printf '%s\n' "$2" "$1" | sort -V | head -n1)" = "$1" ]
        }

        if version_lte "${susfs_version:1}" "1.5.12"; then
          echo "NEED_HOOKS=true" >> $GITHUB_ENV
        fi

        case "$susfs_version" in
          "v1.5.8")
            cd ./KernelSU-Next
            cp ../../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
            patch -p1 --forward --fuzz=3 < 10_enable_susfs_for_ksu.patch  || true
            cp "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/fix_apk_sign.c.patch" ./
            patch -p1 --forward --fuzz=3 < fix_apk_sign.c.patch
            cp "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/fix_core_hook.c.patch" ./
            patch -p1 --forward --fuzz=3 < fix_core_hook.c.patch
            cp "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/fix_selinux.c.patch" ./
            patch -p1 --forward --fuzz=3 < fix_selinux.c.patch
            cp "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/fix_ksud.c.patch" ./
            patch -p1 --forward --fuzz=3 < fix_ksud.c.patch
            ;;
          "v1.5.9"|"v1.5.10"|"v1.5.11"|"v1.5.12")
            cd ./KernelSU-Next
            cp ../../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
            patch -p1 --forward < 10_enable_susfs_for_ksu.patch  || true
            for file in $(find ./kernel -maxdepth 2 -name "*.rej" -printf "%f\n" | cut -d'.' -f1); do
              echo "Patching file: $file.c with fix_$file.c.patch"
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/fix_$file.c.patch"
            done
            patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/fix_kernel_compat.c.patch"
            ;;
          "v2.0.0")
            cd ./KernelSU-Next
            cp ../../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
            patch -p1 --forward < 10_enable_susfs_for_ksu.patch  || true
            for file in $(find ./kernel -maxdepth 2 -name "*.rej" -exec basename {} .rej \;); do
              echo "Patching file: $file with fix_$file.patch"
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/fix_$file.patch"
            done
            echo "Patching Hook Mode!"
            patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/overwrite_hook_mode.patch"
            echo "Patching KSU_TOOLKIT Support for SuSFS kernel!"
            patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/ksu_toolkit.patch"
            ;;
          "v2.1.0")
            cd ./KernelSU-Next
            patch -p1 --forward < "../../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
            for file in $(find ./kernel -maxdepth 2 -name "*.rej" -exec basename {} .rej \;); do
              echo "Patching file: $file with fix_$file.patch"
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/fix_$file.patch"
            done
            echo "Patching Hook Mode!"
            patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/overwrite_hook_mode.patch"
            echo "Patching KSU_TOOLKIT Support for SusFS kernel!"
            patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/ksu_toolkit.patch"

            if [ "$KSUVER" -le 33095 ]; then
              echo "Patching Multi-manager Support for SusFS kernel!"
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/multi_manager.patch"
            fi

            if [ "$KSUVER" -ge 33068 ] && [ "$KSUVER" -lt 33070 ]; then
                echo "Patching Multi-manager sepolicy Support for SusFS kernel!"
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/multi_sepolicy_fix.patch"
            fi
            ;;
          "v2.2.0")
            cd ./KernelSU-Next
            patch -p1 --forward < "../../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
            for file in $(find ./kernel -maxdepth 2 -name "*.rej" -exec basename {} .rej \;); do
              echo "Patching file: $file with fix_$file.patch"
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/fix_$file.patch"
            done
            echo "Patching Hook Mode!"
            patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/overwrite_hook_mode.patch"
            echo "Patching KSU_TOOLKIT Support for SusFS kernel!"
            patch -p1 --forward < "$WILD_KERNEL_PATCHES/next/susfs_fix_patches/$susfs_version/ksu_toolkit.patch"
            ;;
          *)
            echo "::warning::Unsupported SUSFS version: $susfs_version — skipping KernelSU fix patches"
            ;;
        esac
        cd $COMMON
        if [ "${{ env.ANDROID_RELEASE }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
          if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
            sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
          fi
        fi

        fake_patched=0
        fake_patched_expand=0
        if [ "${{ env.ANDROID_RELEASE }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
          if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
            echo "nr_subpages Line not found. Fake Patching!"
            sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
            fake_patched=1
          fi
          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            echo "#include <linux/dma-buf.h> Line not found. Adding missing header"
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
          fi
          if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
            echo "#include <linux/zswap.h> Line not found. Adding missing header"
            sed -i '/#include <linux\/sched\/sysctl.h>/a #include <linux\/zswap.h>' ./mm/memory.c
          fi
          if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c && ! grep -qxF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c; then
            echo "Temporarily expand the \`last_vma_end\` \`if\` block to fix a matching issue."
            perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\)\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);/\t\t\tif (vma->vm_end > last_vma_end) {\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t}/' ./fs/proc/task_mmu.c
            fake_patched_expand=1
          fi
        fi

        if [ "${{ env.ANDROID_RELEASE }}" = "android12" ] && [ "${{ env.KERNEL_VER }}" = "5.10" ]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "vma_pages Line not found. Fake Patching!"
            fake_patched=1
          fi
        fi

        if [ "${{ env.ANDROID_RELEASE }}" = "android13" ] && [ "${{ env.KERNEL_VER }}" = "5.15" ]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "vma_pages Line not found. Fake Patching!"
            fake_patched=1
          fi
          if grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
            echo "#include swap_slots.h> Line found. Deleting header."
            sed -i '/#include <linux\/swap_slots.h>/d' ./mm/memory.c
            fake_patched=1
          fi
        fi

        if [ "${{ env.ANDROID_RELEASE }}" = "android14" ] && [ "${{ env.KERNEL_VER }}" = "6.1" ]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "vma_pages Line not found. Fake Patching!"
            fake_patched=1
          fi
          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            echo "#include <linux/dma-buf.h> Line not found. Adding missing header"
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
          fi
        fi

        patch -p1 < 50_add_susfs_in_${{ env.SUSFS_KERNEL_BRANCH }}.patch

        if [ "$fake_patched_expand" = 1 ]; then
          if [ "${{ env.ANDROID_RELEASE }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
            if grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c && ! grep -qxF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c; then
              perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\) \{\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t\}/\t\t\tif (vma->vm_end > last_vma_end)\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);/' ./fs/proc/task_mmu.c
            fi
          fi
        fi

        if [ "$fake_patched" = 1 ]; then
          if [ "${{ env.ANDROID_RELEASE }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
            if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
              echo "nr_subpages Line found. Revert Fake Patching!"
              sed -i -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
            fi
          fi
          if [ "${{ env.ANDROID_RELEASE }}" = "android12" ] && [ "${{ env.KERNEL_VER }}" = "5.10" ]; then
            if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
              echo "vma_pages Line found. Revert Fake Patching!"
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
          fi
          if [ "${{ env.ANDROID_RELEASE }}" = "android13" ] && [ "${{ env.KERNEL_VER }}" = "5.15" ]; then
            if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
              echo "vma_pages Line found. Revert Fake Patching!"
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
            if ! grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
              echo "#include <linux/swap_slots.h> Line not found. Adding missing header"
              sed -i '/#include <linux\/vmalloc.h>/a #include <linux\/swap_slots.h>' ./mm/memory.c
            fi
          fi
          if [ "${{ env.ANDROID_RELEASE }}" = "android14" ] && [ "${{ env.KERNEL_VER }}" = "6.1" ]; then
            if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
              echo "vma_pages Line found. Revert Fake Patching!"
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
          fi
        fi

        echo "SuSFS added ✅"

        # MTIME: normalize common + KernelSU-Next dirs for ccache consistency
        if [ -n "${MTIME_CACHE:-}" ] && [ -x "$MTIME_CACHE" ]; then
          echo "::group::MTIME -t for SUSFS patched dirs"
          ( "$MTIME_CACHE" -t -d "$COMMON" -k gki-kernel ) || echo "::warning::MTIME set failed for common"
          ( "$MTIME_CACHE" -t -d "$KERNEL_PLATFORM/KernelSU-Next" -k ksun ) || echo "::warning::MTIME set failed for KSU"
          echo "::endgroup::"
        fi

        echo "::endgroup::"

    - name: Apply NoMount (hookless) — RSKSU only
      id: add_nomount
      if: ${{ inputs.use_nomount == 'true' && inputs.ksu_type == 'RSKSU' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply NoMount (hookless) + Ghost"
        if [ -z "${BOUTEILLE_KERNEL_PATCHES:-}" ]; then
          echo "::error::BOUTEILLE_KERNEL_PATCHES not set"
          exit 1
        fi
        if [ ! -f "$BOUTEILLE_KERNEL_PATCHES/scripts/apply_nomount_stack.sh" ]; then
          echo "::error::apply_nomount_stack.sh not found"
          exit 1
        fi

        # The script expects these specific env var names
        export COMMON_KERNEL_FOLDER="$COMMON"
        export KERNEL_PLATFORM_FOLDER="$KERNEL_PLATFORM"
        export BOUTEILLE_KERNEL_PATCHES_FOLDER="$BOUTEILLE_KERNEL_PATCHES"
        export NOMOUNT_REF="main"
        export KERNEL_VER="${{ env.KERNEL_VER }}"
        if [ -n "${NOMOUNT_SUITE:-}" ]; then
          export NOMOUNT_SUITE_FOLDER="$NOMOUNT_SUITE"
        fi
        if [ -n "${KSU_DIR:-}" ]; then
          export KSU_FOLDER="$KSU_DIR"
        fi

        echo "COMMON_KERNEL_FOLDER=$COMMON_KERNEL_FOLDER"
        echo "KERNEL_PLATFORM_FOLDER=$KERNEL_PLATFORM_FOLDER"
        echo "BOUTEILLE_KERNEL_PATCHES_FOLDER=$BOUTEILLE_KERNEL_PATCHES_FOLDER"
        echo "NOMOUNT_REF=$NOMOUNT_REF"

        # Apply hookless (NoMount engine)
        echo "--- Applying hookless ---"
        bash "$BOUTEILLE_KERNEL_PATCHES/scripts/apply_nomount_stack.sh" hookless
        bash "$BOUTEILLE_KERNEL_PATCHES/scripts/apply_nomount_stack.sh" record-version

        # Apply ghost (task-level hiding)
        echo "--- Applying ghost ---"
        bash "$BOUTEILLE_KERNEL_PATCHES/scripts/apply_nomount_stack.sh" ghost || echo "::warning::ghost failed, continuing"

        # Extract NMVER from the copied header
        NM_HDR="$COMMON/fs/nomount.h"
        NMVER="unknown"
        if [ -f "$NM_HDR" ]; then
          NMVER="$(sed -n 's/^#define[[:space:]]\+NM_MODULE_VERSION[[:space:]]\+"\([^"]*\)".*/\1/p' "$NM_HDR" | head -n1)"
        fi
        echo "NMVER=${NMVER:-unknown}" >> "$GITHUB_ENV"
        echo "nomount_version=${NMVER:-unknown}" >> "$GITHUB_OUTPUT"
        echo "✅ NoMount + Ghost applied (version: ${NMVER:-unknown})"

        # MTIME: normalize NoMount dirs for ccache consistency
        if [ -n "${MTIME_CACHE:-}" ] && [ -x "$MTIME_CACHE" ]; then
          echo "::group::MTIME -t for NoMount dirs"
          ( "$MTIME_CACHE" -t -d "$COMMON" -k gki-kernel ) || echo "::warning::MTIME set failed for common"
          if [ -d "$GITHUB_WORKSPACE/nomount_suite" ]; then
            ( "$MTIME_CACHE" -t -d "$GITHUB_WORKSPACE/nomount_suite" -k nomount ) || echo "::warning::MTIME set failed for nomount"
          fi
          echo "::endgroup::"
        fi

        echo "::endgroup::"

    - name: Apply Unicode Fix
      if: ${{ inputs.use_unicode_fix == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply Unicode Fix"
        cd "$COMMON"
        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/unicode_bypass_fix_6.1-.patch" || true
        else
          patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/unicode_bypass_fix_6.1+.patch" || true
        fi
        echo "✅ Unicode Fix applied"
        echo "::endgroup::"

    - name: Patch Ptrace
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Patch Ptrace"
        cd "$COMMON"
        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          echo "Patching ptrace!"
          patch -p1 -F 3 < "$WILD_KERNEL_PATCHES/gki_ptrace.patch"
        else
          echo "Kernel >= $MIN_VERSION, skipping ptrace patch"
        fi
        echo "::endgroup::"

    - name: Add BBG
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding BBG"
        cd "$KERNEL_PLATFORM"
        echo "Adding BBG..."
        if ! wget -q -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash -s main; then
          echo "::warning::BBG setup script failed, continuing anyway"
        fi
        cd "$COMMON"
        ./scripts/config --file arch/arm64/configs/gki_defconfig --enable CONFIG_BBG
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
        echo "BBG LSM added ✅"

        # MTIME: normalize BBG dir for ccache consistency
        if [ -n "${MTIME_CACHE:-}" ] && [ -x "$MTIME_CACHE" ]; then
          echo "::group::MTIME -t for BBG dir"
          if [ -d "$KERNEL_PLATFORM/Baseband-guard" ]; then
            ( "$MTIME_CACHE" -t -d "$KERNEL_PLATFORM/Baseband-guard" -k bbg ) || echo "::warning::MTIME set failed for BBG"
          fi
          ( "$MTIME_CACHE" -t -d "$COMMON" -k gki-kernel ) || echo "::warning::MTIME set failed for common"
          echo "::endgroup::"
        fi

        echo "::endgroup::"

    - name: Apply KSUN Hooks
      shell: bash
      if: ${{ env.NEED_HOOKS == 'true' }}
      run: |
        set -euo pipefail
        cd "$COMMON"
        patch -p1 < $WILD_KERNEL_PATCHES/next/scope_min_manual_hooks_v1.4.patch

    - name: Add KernelSU Configuration Settings
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding KernelSU configs..."
        cd "$COMMON"

        DEFCONFIG="arch/arm64/configs/gki_defconfig"

        ./scripts/config --file "$DEFCONFIG" \
          --enable CONFIG_KSU \
          --disable CONFIG_KSU_KPROBES_HOOK \
          --enable CONFIG_TMPFS_XATTR \
          --enable CONFIG_TMPFS_POSIX_ACL \
          --enable CONFIG_KSU_MULTI_MANAGER_SUPPORT \
          --enable CONFIG_KSU_TOOLKIT_SUPPORT

        KSU_TAG_DISPLAY="${{ steps.add_ksu.outputs.ksun_tag }}"
        [ -z "$KSU_TAG_DISPLAY" ] && KSU_TAG_DISPLAY="v1.0.0"
        sed -i -e '/^CONFIG_KSU_FULL_NAME_FORMAT=/d' "$DEFCONFIG" || true
        printf 'CONFIG_KSU_FULL_NAME_FORMAT="%s-EmberHeart@%s"\n' "${KSU_TAG_DISPLAY}" "${{ inputs.ksu_type }}" >> "$DEFCONFIG"

        echo "KernelSU configuration added ✅"
        echo "::endgroup::"

    - name: Add SUSFS Configuration Settings
      if: ${{ inputs.use_susfs == 'true' && inputs.ksu_type == 'KSU_NEXT' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding SUSFS configs..."
        cd "$COMMON"

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_KSU_SUSFS \
          --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
          --enable CONFIG_KSU_SUSFS_SUS_PATH \
          --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
          --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
          --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
          --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
          --disable CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
          --enable CONFIG_KSU_SUSFS_TRY_UMOUNT \
          --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
          --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
          --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
          --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
          --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT \
          --enable CONFIG_KSU_SUSFS_SUS_MAP \
          --disable CONFIG_KSU_SUSFS_SUS_SU

    - name: Add NTSync (patch availability check)
      if: ${{ inputs.use_ntsync == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add NTSync"
        cd "$COMMON"
        NTSYNC_FOLDER="$WILD_KERNEL_PATCHES/common/ntsync"
        GKI_KEY="${{ env.ANDROID_RELEASE }}-${{ env.KERNEL_VER }}"
        OS_VER_TAG="A$(echo "${{ env.ANDROID_RELEASE }}" | sed 's/^android//')"

        if [ ! -d "$NTSYNC_FOLDER" ]; then
          echo "::warning::ntsync folder not found in WildKernels patches, skipping"
          echo "::endgroup::"; exit 0
        fi

        NTSYNC_PATCH=""
        if [ -f "$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}_${OS_VER_TAG}.patch" ]; then
          NTSYNC_PATCH="$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}_${OS_VER_TAG}.patch"
        elif [ -f "$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}.patch" ]; then
          NTSYNC_PATCH="$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}.patch"
        else
          echo "::warning::No ntsync patch found for ${GKI_KEY} (${OS_VER_TAG}). Available patches:"
          ls "$NTSYNC_FOLDER" 2>/dev/null | head -n 20 || true
          echo "::endgroup::"; exit 0
        fi

        echo "Using patch: $(basename $NTSYNC_PATCH)"
        if [ "${{ env.ANDROID_RELEASE }}" = "android16" ] && [ "${{ env.KERNEL_VER }}" = "6.12" ]; then
          rm -f include/uapi/linux/ntsync.h
          rm -f drivers/misc/ntsync.c
        fi
        patch -p1 --forward < "$NTSYNC_PATCH" || true
        if [ -f "$NTSYNC_FOLDER/ntsync_base.patch" ]; then
          patch -p1 --forward < "$NTSYNC_FOLDER/ntsync_base.patch" || true
        fi
        echo "CONFIG_NTSYNC=y" >> "$COMMON/arch/arm64/configs/gki_defconfig"
        echo "✅ NTSync applied"
        echo "::endgroup::"

    - name: Add Oneplus BBR
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding Oneplus BBR"
        cd "$COMMON"

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_TCP_CONG_ADVANCED \
          --enable CONFIG_TCP_CONG_BBR \
          --enable CONFIG_TCP_CONG_BBR3 \
          --enable CONFIG_NET_SCH_FQ \
          --enable CONFIG_NET_SCH_FQ_CODEL \
          --enable CONFIG_NET_SCH_CAKE \
          --enable CONFIG_NET_SCH_MQPRIO \
          --enable CONFIG_NET_SCH_PIE \
          --enable CONFIG_NET_SCH_FQ_PIE \
          --disable CONFIG_HZ_250 \
          --disable CONFIG_HZ_1000 \
          --enable CONFIG_HZ_300 \
          --set-val CONFIG_HZ 300 \
          --enable CONFIG_TCP_CONG_ROCCET

        echo "OnePlus BBR added ✅"
        echo "::endgroup::"

    - name: Add IPv6 NAT
      if: ${{ inputs.use_ipv6_nat == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add IPv6 NAT"
        cd "$COMMON"
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_IP6_NF_NAT \
          --enable CONFIG_IP6_NF_TARGET_MASQUERADE
        if [ -f "$WILD_KERNEL_PATCHES/common/IPv6_NAT_FIX.patch" ]; then
          patch -p1 -F 3 < "$WILD_KERNEL_PATCHES/common/IPv6_NAT_FIX.patch" || true
        fi
        echo "✅ IPv6 NAT added"
        echo "::endgroup::"

    - name: Add my kernel patches to common kernel
      if: env.SOC == 'kalama' && !contains(env.MANIFEST_NAME, 'CUSTOM') && inputs.use_opt_patches == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying my patches from my repo..."
        cd "$COMMON"

        for patch_file in $KERNEL_PATCHES/kernel_patches/op11/common/*.patch; do
            echo "Applying patch: $patch_file"
            patch -p1 < "$patch_file"
        done

        echo "My kernel patches applied ❤️‍🔥"
        echo "::endgroup::"

    - name: Add other kernel patches to common kernel
      if: ${{ inputs.use_opt_patches == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying patches from wild kernels..."
        cd "$COMMON"

        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"

        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/optimized_mem_operations.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/file_struct_8bytes_align.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/reduce_cache_pressure.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/mem_opt_prefetch.patch"

        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/optimise_memcmp.patch"
        elif [ "$(printf '%s\n' "$KERNEL_VERSION" "5.11" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          sed -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' "$WILD_KERNEL_PATCHES/common/optimise_memcmp.patch" | patch -p1 --forward
        else
          echo "Optimised memcmp patch not found!"
        fi

        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/minimise_wakeup_time.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/int_sqrt.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/force_tcp_nodelay.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/reduce_gc_thread_sleep_time.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/add_timeout_wakelocks_globally.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/f2fs_reduce_congestion.patch"
        patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/reduce_freeze_timeout.patch"

        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/clear_page_16bytes_align.patch"
        else
          cat "$WILD_KERNEL_PATCHES/common/clear_page_16bytes_align.patch" | sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' | patch -p1 -F3 --forward
        fi

        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/add_limitation_scaling_min_freq.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/re_write_limitation_scaling_min_freq.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/adjust_cpu_scan_order.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/avoid_extra_s2idle_wake_attempts.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/disable_cache_hot_buddy.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/f2fs_enlarge_min_fsync_blocks.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/increase_ext4_default_commit_age.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/increase_sk_mem_packets.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/reduce_pci_pme_wakeups.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/silence_irq_cpu_logspam.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/silence_system_logspam.patch"
        patch -p1 -F3 --forward < "$WILD_KERNEL_PATCHES/common/use_unlikely_wrap_cpufreq.patch"

        echo "Other kernel patches applied 🔥"
        echo "::endgroup::"

    - name: Add Nethunter inline configs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying Nethunter configs..."
        cd "$COMMON"

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
