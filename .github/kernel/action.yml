        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_USB_AIRSPY \
          --enable CONFIG_USB_HACKRF

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN \
          --enable CONFIG_CAN_DEV \
          --enable CONFIG_CAN_CALC_BITTIMING \
          --enable CONFIG_CAN_LEDS \
          --enable CONFIG_CAN_VCAN \
          --enable CONFIG_CAN_GRCAN \
          --enable CONFIG_CAN_XILINXCAN

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_C_CAN \
          --enable CONFIG_CAN_C_CAN_PLATFORM \
          --enable CONFIG_CAN_C_CAN_PCI

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_CC770 \
          --enable CONFIG_CAN_CC770_ISA \
          --enable CONFIG_CAN_CC770_PLATFORM

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_M_CAN \
          --enable CONFIG_CAN_M_CAN_PCI \
          --enable CONFIG_CAN_M_CAN_PLATFORM \
          --enable CONFIG_CAN_M_CAN_TCAN4X5X

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_HI311X \
          --enable CONFIG_CAN_MCP251X

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_CAN_8DEV_USB \
          --enable CONFIG_CAN_EMS_USB \
          --enable CONFIG_CAN_ESD_USB2 \
          --enable CONFIG_CAN_GS_USB \
          --enable CONFIG_CAN_KVASER_USB \
          --enable CONFIG_CAN_PEAK_USB

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_NETLINK_DIAG \
          --enable CONFIG_VSOCKETS \
          --enable CONFIG_NET_SCHED \
          --enable CONFIG_NET_EMATCH_CANID

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_USB_SERIAL \
          --enable CONFIG_USB_SERIAL_CONSOLE \
          --enable CONFIG_USB_SERIAL_GENERIC \
          --enable CONFIG_USB_SERIAL_CH341 \
          --enable CONFIG_USB_SERIAL_FTDI_SIO \
          --enable CONFIG_USB_SERIAL_PL2303

        echo "Nethunter configs applied ✅"
        echo "::endgroup::"

    - name: Add Other configs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding other configs..."
        cd "$COMMON"

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_LRU_GEN_ENABLED

        echo "Applying patch to enable SYSVIPC without breaking ABI"
        case "$BRANCH" in
          oneplus/sm8850|oneplus/sm8845)
            if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_a16-6.12.patch" >/dev/null 2>&1; then
              echo "[INFO] Patch already applied. Skipping."
            else
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_a16-6.12.patch"
            fi
            ;;
          oneplus/sm8550|oneplus/sm7550)
            if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_1_2_3.patch" >/dev/null 2>&1; then
              echo "[INFO] Patch already applied. Skipping."
            else
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_1_2_3.patch"
            fi
            ;;
          oneplus/sm8450|oneplus/sm8475|oneplus/mt6895|oneplus/mt6983|oneplus/mt6789)
            if [ "$ANDROID_RELEASE" = "android12" ] && [ "$KERNEL_VER" = "5.10" ]; then
              if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_bypass_a16-6.12_below.patch" >/dev/null 2>&1; then
                echo "[INFO] Patch already applied. Skipping."
              else
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_bypass_a16-6.12_below.patch"
              fi
              if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_abi_padding_for_posix_mqueue.patch" >/dev/null 2>&1; then
                echo "[INFO] Patch already applied. Skipping."
              else
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_abi_padding_for_posix_mqueue.patch"
              fi
            else
              if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch" >/dev/null 2>&1; then
                echo "[INFO] Patch already applied. Skipping."
              else
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"
              fi
            fi
            ;;
          los/sm8550)
            if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_3_4_5.patch" >/dev/null 2>&1; then
                echo "[INFO] Patch already applied. Skipping."
            else
                patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_3_4_5.patch"
            fi
            ;;
          *)
            if patch -R -p1 -s -f --dry-run < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch" >/dev/null 2>&1; then
              echo "[INFO] Patch already applied. Skipping."
            else
              patch -p1 --forward < "$WILD_KERNEL_PATCHES/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"
            fi
            ;;
        esac

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
                  --enable CONFIG_SYSVIPC \
                  --enable CONFIG_DEVTMPFS \
                  --enable CONFIG_PID_NS \
                  --enable CONFIG_POSIX_MQUEUE \
                  --enable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
                  --enable CONFIG_NETFILTER_XT_SET \
                  --enable CONFIG_NETFILTER_XT_TARGET_REJECT \
                  --enable CONFIG_NETFILTER_XT_TARGET_LOG \
                  --enable CONFIG_NETFILTER_XT_MATCH_RECENT \
                  --enable CONFIG_USER_NS

        echo "Other configs added ✅"
        echo "::endgroup::"

    - name: Vendor Module Debloat
      if: ${{ inputs.vendor_debloat != '' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Vendor Module Debloat"
        cd "$COMMON"

        RISKY_MODULES=("coresight" "rust_binder" "msm_kgsl" "camera")
        IFS=',' read -ra ADDR <<< "${{ inputs.vendor_debloat }}"
        declare -a validated=()
        for mod in "${ADDR[@]}"; do
          mod="$(echo "$mod" | xargs)"
          [ -z "$mod" ] && continue
          is_risky=false
          for r in "${RISKY_MODULES[@]}"; do
            if [ "$mod" = "$r" ]; then
              is_risky=true
              echo "::warning::Blocked risky module: $mod"
              break
            fi
          done
          [ "$is_risky" = false ] && validated+=("$mod")
        done

        if [ ${#validated[@]} -eq 0 ]; then
          echo "No valid modules to debloat, skipping."
          echo "::endgroup::"; exit 0
        fi

        RAW_JOINED=$(IFS=,; echo "${validated[*]}")
        RESULT_LIST="\"${RAW_JOINED}\""
        echo "CONFIG_DEBLOAT_VENDOR_MODULES=${RESULT_LIST}" >> arch/arm64/configs/gki_defconfig

        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          DEBLOAT_URL="https://raw.githubusercontent.com/Bouteillepleine/kernel_patches/main/experimental/0001-Support-conditional-vendor-modules-blacklisting-5.15-and-below.patch"
        else
          DEBLOAT_URL="https://raw.githubusercontent.com/Bouteillepleine/kernel_patches/main/experimental/0001-Support-conditional-vendor-modules-blacklisting-6.1-and-above.patch"
        fi
        curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "$DEBLOAT_URL" | patch -p1 || true
        echo "✅ Vendor debloat applied: $RESULT_LIST"
        echo "::endgroup::"

    - name: Add ADIOS I/O Scheduler
      if: ${{ inputs.use_adios == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add ADIOS I/O Scheduler"
        cd "$COMMON"
        if [ -z "${ADIOS_PATCHES_FOLDER:-}" ] || [ ! -d "$ADIOS_PATCHES_FOLDER" ]; then
          echo "::warning::ADIOS patches folder not available, skipping"
          echo "::endgroup::"; exit 0
        fi
        PATCH_FILE=""
        case "${KERNEL_VER}" in
          "6.12") PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.12.patch" ;;
          "6.6")  PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.6.patch" ;;
          "5.15") PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_5.15.patch" ;;
          "5.10") PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_5.10.patch" ;;
          "6.1")
            if [ "${TKERNEL_VER:-}" = "6.1.115" ] && { [[ "${BRANCH:-}" == *mt* ]] || [[ "${SOC:-}" == *dimensity* ]] || [[ "${SOC:-}" == *mediatek* ]] || [[ "${SOC:-}" == *mt* ]]; }; then
              PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.1_mt6989.patch"
            elif [ "${TKERNEL_VER:-}" = "6.1.57" ] || [ "${TKERNEL_VER:-}" = "6.1.75" ]; then
              PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.1_old.patch"
            else
              PATCH_FILE="$ADIOS_PATCHES_FOLDER/adios_ioscheduler_6.1.patch"
            fi
            ;;
          *) echo "::warning::ADIOS not supported on ${KERNEL_VER}"; echo "::endgroup::"; exit 0 ;;
        esac
        if [ ! -f "$PATCH_FILE" ]; then
          echo "::warning::ADIOS patch not found: $PATCH_FILE"
          echo "::endgroup::"; exit 0
        fi
        if [ -f "block/adios.c" ]; then
          echo "ADIOS already present, skipping patch."
        else
          patch -p1 --ignore-whitespace -F 3 < "$PATCH_FILE" || true
        fi
        DEFCONFIG="$COMMON/arch/arm64/configs/gki_defconfig"
        if ! grep -q "^CONFIG_MQ_IOSCHED_ADIOS=" "$DEFCONFIG"; then
          {
            echo "CONFIG_MQ_IOSCHED_ADIOS=y"
            echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y"
          } >> "$DEFCONFIG"
        fi
        echo "✅ ADIOS setup completed"
        echo "::endgroup::"

    - name: Add TTL Target Support
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding TTL support..."
        cd "$COMMON"

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_IP_NF_TARGET_TTL \
          --enable CONFIG_IP6_NF_TARGET_HL \
          --enable CONFIG_IP6_NF_MATCH_HL

        echo "TTL support added ✅"
        echo "::endgroup::"

    - name: Add IP SET Support
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding IP SET support..."
        cd "$COMMON"

        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        if [[ "$KERNEL_VERSION" != "6.12" ]] && [[ "$BRANCH" != wild/mt* ]]; then
          echo "CONFIG_BPF_STREAM_PARSER=y" >> arch/arm64/configs/gki_defconfig
        fi

        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          --enable CONFIG_IP_SET \
          --set-val CONFIG_IP_SET_MAX 65534 \
          --enable CONFIG_IP_SET_BITMAP_IP \
          --enable CONFIG_IP_SET_BITMAP_IPMAC \
          --enable CONFIG_IP_SET_BITMAP_PORT \
          --enable CONFIG_IP_SET_HASH_IP \
          --enable CONFIG_IP_SET_HASH_IPMARK \
          --enable CONFIG_IP_SET_HASH_IPPORT \
          --enable CONFIG_IP_SET_HASH_IPPORTIP \
          --enable CONFIG_IP_SET_HASH_IPPORTNET \
          --enable CONFIG_IP_SET_HASH_IPMAC \
          --enable CONFIG_IP_SET_HASH_MAC \
          --enable CONFIG_IP_SET_HASH_NETPORTNET \
          --enable CONFIG_IP_SET_HASH_NET \
          --enable CONFIG_IP_SET_HASH_NETNET \
          --enable CONFIG_IP_SET_HASH_NETPORT \
          --enable CONFIG_IP_SET_HASH_NETIFACE \
          --enable CONFIG_IP_SET_LIST_SET

        echo "IP SET support added ✅"
        echo "::endgroup::"

    - name: Add Build based configs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying build based configs..."
        cd "$COMMON"

        LTO_INPUT="${{ inputs.lto }}"
        case "$LTO_INPUT" in
          none|None|NONE)
            ./scripts/config --file arch/arm64/configs/gki_defconfig \
              --disable CONFIG_LTO_CLANG_THIN \
              --disable CONFIG_LTO_CLANG_FULL \
              --enable CONFIG_LTO_NONE || true
            ;;
          Thin)
            ./scripts/config --file arch/arm64/configs/gki_defconfig \
              --enable CONFIG_LTO_CLANG_THIN \
              --enable CONFIG_LTO_CLANG
            ;;
          Full)
            ./scripts/config --file arch/arm64/configs/gki_defconfig \
              --enable CONFIG_LTO_CLANG_FULL \
              --enable CONFIG_LTO_CLANG
            ;;
        esac

        if [ "${{ inputs.optimize_level }}" = "O3" ]; then
          ./scripts/config --file arch/arm64/configs/gki_defconfig \
            --disable CC_OPTIMIZE_FOR_PERFORMANCE \
            --enable CC_OPTIMIZE_FOR_PERFORMANCE_O3
        else
          ./scripts/config --file arch/arm64/configs/gki_defconfig \
           --enable CC_OPTIMIZE_FOR_PERFORMANCE \
           --disable CC_OPTIMIZE_FOR_PERFORMANCE_O3
        fi
        echo "Build configs applied ✅"
        echo "::endgroup::"

    - name: Customize Kernel Branding
      shell: bash
      env:
        INPUT_UNAME: ${{ inputs.kernel_uname }}
      run: |
        set -euo pipefail
        echo "::group::Applying Kernel Branding..."
        cd "$COMMON"
        if [ -n "$INPUT_UNAME" ]; then
          CUSTOM_LOCALVERSION="-${ANDROID_RELEASE}-${{ inputs.kernel_uname }}"
          echo "CUSTOM_LOCALVERSION=$CUSTOM_LOCALVERSION" >> "$GITHUB_ENV"
          echo "[INFO] Using kernel version: ${KERNEL_FULL_VER}${CUSTOM_LOCALVERSION}"
        else
          SCM=$(./scripts/setlocalversion 2>/dev/null || echo "-g$(git rev-parse --short HEAD)") || echo "ERROR"
          echo "[INFO] Using default kernel version: ${KERNEL_FULL_VER}${SCM}"
        fi
        echo "Kernel branding applied ✅"
        echo "::endgroup::"

    - name: Build Kernel
      id: build_kernel
      shell: bash
      env:
        PYTHONWARNINGS: "ignore:invalid escape sequence"
      run: |
        set -euo pipefail
        echo "::group::Build kernel"
        cd "$COMMON"

        export PYTHONWARNINGS="${PYTHONWARNINGS}"

        if [ -d "$KERNEL_PLATFORM/build/build-tools/path" ]; then
          export PATH="$KERNEL_PLATFORM/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        # MTIME -u: detect changes and force recompilation only for changed files
        if [ -n "${MTIME_CACHE:-}" ] && [ -x "$MTIME_CACHE" ]; then
          echo "::group::MTIME -u (detect changes)"
          ( "$MTIME_CACHE" -u -d "$COMMON" -k gki-kernel ) || echo "::warning::MTIME update failed for common"
          [ -d "$MSM" ] && ( "$MTIME_CACHE" -u -d "$MSM" -k msm-kernel ) || true
          [ -d "$CONFIG/vendor" ] && ( "$MTIME_CACHE" -u -d "$CONFIG/vendor" -k vendor ) || true
          [ -d "$KERNEL_PLATFORM/Baseband-guard" ] && ( "$MTIME_CACHE" -u -d "$KERNEL_PLATFORM/Baseband-guard" -k bbg ) || true
          [ -d "$KERNEL_PLATFORM/susfs4ksu" ] && ( "$MTIME_CACHE" -u -d "$KERNEL_PLATFORM/susfs4ksu" -k susfs ) || true
          [ -n "${KSU_DIR:-}" ] && [ -d "$KSU_DIR" ] && ( "$MTIME_CACHE" -u -d "$KSU_DIR" -k ksun ) || true
          [ -d "$GITHUB_WORKSPACE/nomount_suite" ] && ( "$MTIME_CACHE" -u -d "$GITHUB_WORKSPACE/nomount_suite" -k nomount ) || true
          echo "::endgroup::"
        fi

        LTO_INPUT="${{ inputs.lto }}"
        if [ "$LTO_INPUT" = "Thin" ]; then
          echo '#!/bin/bash' > ld-wrapper
          echo 'ld.lld "$@" --thinlto-cache-dir=$LDCACHE_DIR --thinlto-jobs=$(nproc --all)' >> ld-wrapper
          chmod +x ld-wrapper
          LD="$(pwd)/ld-wrapper"
        else
          LD="ld.lld"
        fi

        if [ -d "$KERNEL_PLATFORM/build/build-tools/path" ]; then
          DTC="$KERNEL_PLATFORM/build/kernel/build-tools/path/linux-x86/dtc"
        else
          DTC="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin/dtc"
        fi

        if [ "${{ inputs.clean_build }}" = "true" ]; then
          echo "🧹 Clean build mode: clearing ccache"
          ccache -C >/dev/null 2>&1 || true
        fi

        if [ -n "${{ inputs.build_timestamp }}" ]; then
          export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_timestamp }}"
          echo "📅 Using custom build timestamp: $KBUILD_BUILD_TIMESTAMP"
        else
          export KBUILD_BUILD_TIMESTAMP="$(date -u)"
          echo "📅 Using current build timestamp: $KBUILD_BUILD_TIMESTAMP"
        fi
        echo "build_timestamp_used=$KBUILD_BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
        echo "EFFECTIVE_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" >> "$GITHUB_ENV"

        MAKE_FLAGS+=(
          LLVM=1
          LLVM_IAS=1
          ARCH=arm64
          CROSS_COMPILE="aarch64-linux-gnu-"
          LD="${LD}"
          DTC="${DTC}"
          DTC_FLAGS="-@"
          HOSTCC="ccache clang"
          HOSTCXX="ccache clang++"
          CC="ccache clang"
        )

        OUT=out
        INSTALL_MOD_PATH="$COMMON/out"
        mkdir -p "$OUT"

        CONFIGS=(
            "gki_defconfig"
        )

        if [[ "$BUILD_TYPE" == "Monolithic Build" ]]; then
          if [ -f "arch/arm64/configs/vendor/${SOC}_GKI.config" ]; then
            CONFIGS+=("vendor/${SOC}_GKI.config")
          fi
          if [ -f "arch/arm64/configs/vendor/oplus/${SOC}_GKI.config" ]; then
            CONFIGS+=("vendor/oplus/${SOC}_GKI.config")
          fi
          if [ -f "arch/arm64/configs/vendor/debugfs.config" ]; then
            CONFIGS+=("vendor/debugfs.config")
          fi
        fi

        make "${MAKE_FLAGS[@]}" O="$OUT" "${CONFIGS[@]}"

        if [ -n "${CUSTOM_LOCALVERSION:-}" ]; then
          : > "$COMMON/.scmversion"
          ./scripts/config --file "$OUT/.config" \
            --set-str LOCALVERSION "${CUSTOM_LOCALVERSION}" \
            --disable LOCALVERSION_AUTO
          sed -i 's/scm_version="$(scm_version --short)"/scm_version=""/' scripts/setlocalversion
          echo "[INFO] Custom branding applied to config"
        else
          ./scripts/config --file "$OUT/.config" \
            --enable LOCALVERSION_AUTO
        fi

        echo "kernel_release=$(make "${MAKE_FLAGS[@]}" O="$OUT" -s kernelrelease)" >> "$GITHUB_ENV"

        echo "Starting build with $(nproc --all) threads..."
        SECONDS=0

        make "${MAKE_FLAGS[@]}" O="$OUT" olddefconfig

        if [[ "$BUILD_TYPE" == "Mixed Build" || "$BUILD_TYPE" == "Modules Only" ]]; then
          make -j$(nproc --all) "${MAKE_FLAGS[@]}"  O="$OUT" Image modules
          make -j$(nproc --all) "${MAKE_FLAGS[@]}" O="$OUT" INSTALL_MOD_STRIP=1 INSTALL_MOD_PATH="$INSTALL_MOD_PATH" modules_install
        else
          make -j$(nproc --all) "${MAKE_FLAGS[@]}"  O="$OUT" Image
        fi

        echo "duration=$SECONDS" >> "$GITHUB_ENV"

        IMG="$OUT/arch/arm64/boot/Image"
        if [ ! -f "$IMG" ]; then
          echo "Kernel Image missing"
          exit 1
        fi
        sha256sum "$IMG" | tee "$OUT/Image.sha256"
        echo "Kernel built 😆"

        cp "$OUT/System.map" "$ARTIFACTS_DIR_DEBUG"
        if [[ "$BUILD_TYPE" == "Mixed Build" || "$BUILD_TYPE" == "Modules Only" ]]; then
          cp "$OUT/Module.symvers" "$ARTIFACTS_DIR_DEBUG"
        fi
        cp "$OUT/vmlinux" "$ARTIFACTS_DIR_DEBUG"

        echo "::endgroup::"

    - name: ccache Post-Build Statistics
      id: ccache_stats
      if: ${{ inputs.clean_build != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::ccache stats"
        export CCACHE_DIR="${{ env.CCACHE_DIR }}"
        ccache -c || true
        ccache --evict-older-than 10800s || true
        STATS="$(ccache -s || true)"
        CACHEABLE=$(echo "$STATS" | awk '/Cacheable calls:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
        HITS=$(echo "$STATS" | awk '/^[[:space:]]*Hits:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
        DIRECT=$(echo "$STATS" | awk '/Direct:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
        if [ "${CACHEABLE:-0}" -gt 0 ]; then
          HIT_RATE=$(awk -v h="${HITS:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (h/c)*100}')
          DIRECT_RATE=$(awk -v d="${DIRECT:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (d/c)*100}')
        else
          HIT_RATE="0.0"; DIRECT_RATE="0.0"
        fi
        echo "hit_rate=${HIT_RATE}%" >> "$GITHUB_OUTPUT"
        echo "direct_rate=${DIRECT_RATE}%" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"

    - name: Copy Files for Mixed builds
      if: ${{ env.BUILD_TYPE == 'Mixed Build' || env.BUILD_TYPE == 'Kernel Only' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Copying files for mixed build"
        OUT="$COMMON/out"

        cp "$OUT/arch/arm64/boot/Image" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/vmlinux" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/System.map" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/vmlinux.symvers" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/modules.builtin" "$KBUILD_MIXED_TREE_DIR"
        cp "$OUT/modules.builtin.modinfo" "$KBUILD_MIXED_TREE_DIR"

        echo "[DEBUG] KBUILD_MIXED_TREE_DIR contents: $(ls ${KBUILD_MIXED_TREE_DIR})"
        echo "::endgroup::"

    - name: Collect Build Stats / Validate Image
      id: collect_kernel_stats
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Collecting Build Stats..."
        OUT="$COMMON/out"
        IMG="$OUT/arch/arm64/boot/Image"

        echo "[DEBUG] Kernel build completed in ${duration}s"

        WARNINGS="0"
        if [ -f "$COMMON/build.log" ]; then
          WARNINGS=$(grep -ciE 'warning:' "$COMMON/build.log" 2>/dev/null) || true
          WARNINGS="${WARNINGS:-0}"
        fi
        echo "$WARNINGS" > "$OUT/warnings.txt"

        if [ -f "$IMG" ]; then
          file "$IMG" > "$OUT/Image.file" || true
          KERNEL_UNAME=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1 || true)
          echo "Kernel Uname: ${KERNEL_UNAME:-unknown}"
          echo "KERNEL_UNAME=${KERNEL_UNAME:-unknown}" >> "$GITHUB_ENV"

          if ! file "$IMG" | grep -qi 'ARM64'; then
            echo "WARNING: Image does not appear to be ARM64:"
            file "$IMG" || true
          fi

          MIN_SIZE=$((6*1024*1024))
          ACTUAL_SIZE=$(stat -c %s "$IMG" || echo 0)
          if [ "$ACTUAL_SIZE" -lt "$MIN_SIZE" ]; then
            echo "WARNING: Image size $ACTUAL_SIZE < $MIN_SIZE (suspicious)."
          fi

          CALC_SHA=$(sha256sum "$IMG" | cut -d' ' -f1)
          if [ -f "$OUT/Image.sha256" ]; then
            REC_SHA=$(cut -d' ' -f1 "$OUT/Image.sha256" | tr -d '\n')
            if [ "$CALC_SHA" != "$REC_SHA" ]; then
              echo "WARNING: Image.sha256 mismatch. recorded=$REC_SHA calculated=$CALC_SHA"
            fi
            IMAGE_SHA256="$REC_SHA"
          else
            IMAGE_SHA256="$CALC_SHA"
          fi
        else
          echo "WARNING: Image file not found at $IMG"
          IMAGE_SHA256=""
          KERNEL_UNAME="unknown"
          echo "KERNEL_UNAME=unknown" >> "$GITHUB_ENV"
        fi

        echo "Image sha256: ${IMAGE_SHA256:-none}"
        echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"
        echo "image_sha256=${IMAGE_SHA256:-}" >> "$GITHUB_OUTPUT"
        echo "Build stats collected ✅"
        echo "::endgroup::"

    - name: Create Kernel ZIP
      id: create_zip
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Creating AK3 zip..."
        IMAGE_PATH="$COMMON/out/arch/arm64/boot/Image"
        if [ ! -f "$IMAGE_PATH" ]; then
          echo "ERROR: Built Image not found"
          exit 1
        fi

        cp "$IMAGE_PATH" "$GITHUB_WORKSPACE/AnyKernel3/Image"
        cd "$GITHUB_WORKSPACE/AnyKernel3"

        KSU_TAG_SUFFIX=""
        if [ "${{ inputs.ksu_type }}" = "RSKSU" ]; then
          KSU_TAG_SUFFIX="ReSukiSU"
        else
          KSU_TAG_SUFFIX="Next"
        fi

        NMS_SUFFIX=""
        if [ "${{ inputs.use_nomount }}" = "true" ]; then
          NMS_SUFFIX="_NoMount_${NMVER:-unknown}"
        fi

        SUSFS_SUFFIX=""
        if [ "${{ inputs.use_susfs }}" = "true" ] && [ "${{ inputs.ksu_type }}" = "KSU_NEXT" ]; then
          SUSFS_SUFFIX="_SuSFS_${SUSVER:-unknown}"
        fi

        ZIP_NAME="AnyKernel3_${MODEL}_${{ inputs.optimize_level }}_${KERNEL_FULL_VER}_${KSU_TAG_SUFFIX}_${KSUVER:-unknown}${SUSFS_SUFFIX}${NMS_SUFFIX}.zip"

        echo "Creating flashable zip: $ZIP_NAME"
        ( cd "$GITHUB_WORKSPACE/AnyKernel3" && zip -r "$ARTIFACTS_DIR/$ZIP_NAME" ./* >/dev/null )

        find "$ARTIFACTS_DIR" -maxdepth 1 -type f ! -name "$ZIP_NAME" ! -name "${MODEL}.txt" -delete

        echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
        echo "AnyKernel3 zip created ✅"
        echo "::endgroup::"

    - name: Create Boot Image
      if: success() && steps.create_zip.conclusion == 'success'
      id: create_boot
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Creating boot image..."
        OUT="$COMMON/out"
        IMAGE="$OUT/arch/arm64/boot/Image"
        MKBOOTIMG="$KERNEL_PLATFORM/tools/mkbootimg/mkbootimg.py"

        if [ -d "$KERNEL_PLATFORM/build/build-tools/path" ]; then
          export PATH="$KERNEL_PLATFORM/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        MKBOOTIMG_ARGS=(
          "--header_version" "4"
          "--os_version" "13.0.0"
          "--os_patch_level" "2099-12-01"
          "--pagesize" "4096"
          "--kernel" "$IMAGE"
          "--output" "$OUT/boot.img"
        )

        echo "Creating boot image"
        "$MKBOOTIMG" "${MKBOOTIMG_ARGS[@]}"

        echo "Signing boot image"
        avbtool add_hash_footer \
          --partition_name boot \
          --partition_size "$BOOT_PARTITION_SIZE" \
          --image "$OUT/boot.img" \
          --algorithm "SHA256_RSA4096" \
          --key "$KERNEL_PLATFORM/tools/mkbootimg/gki/testdata/testkey_rsa4096.pem"

        cp "$OUT/boot.img" "$ARTIFACTS_DIR"
        BOOT_SHA256=$(sha256sum "$OUT/boot.img" | cut -d' ' -f1)
        echo "boot_sha256=${BOOT_SHA256:-ERROR}" >> "$GITHUB_OUTPUT"
        echo "Boot image created ✅"
        echo "::endgroup::"

    - name: Create system_dlkm Image
      if: ${{ inputs.compile_dlkm == 'true'  && env.BUILD_TYPE != 'Monolithic Build' }}
      id: create_system_dlkm
      shell: bash
      run: |
        PREBUILTS="https://raw.githubusercontent.com/terminal-beginner/kernel_patches/refs/heads/main/prebuilts/$MODEL"
        OUT="$COMMON/out"
        UNAME=$(ls "$OUT/lib/modules/")
        DLKM_STAGING_DIR="$OUT/system_dlkm_staging"
        DLKM_STAGING_ROOT="$DLKM_STAGING_DIR/lib/modules/$UNAME"

        if [ -d "$KERNEL_PLATFORM/build/build-tools/path" ]; then
          export PATH="$KERNEL_PLATFORM/build/build-tools/path/linux-x86:$PATH"
        else
          export PATH="$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin:$PATH"
        fi

        mkdir -p "$DLKM_STAGING_DIR/lib"
        cp -a "$OUT/lib/modules" "$DLKM_STAGING_DIR/lib/"
        cp "$DLKM_STAGING_ROOT/modules.order" "$DLKM_STAGING_ROOT/modules.load"
        cp "$DLKM_STAGING_ROOT/modules.load" "$OUT/system_dlkm.modules.load"

        cd "$DLKM_STAGING_ROOT"
        rm build source modules.builtin.modinfo

        cd "$DLKM_STAGING_DIR"
        mkdir -p etc
        cd etc
        curl -sL -o build.prop "$PREBUILTS/system_dlkm/build.prop"
        touch fs_config_dirs fs_config_files

        cd "$OUT"
        system_dlkm_props_file="$(mktemp)"
        echo -e "system_dlkm_fs_type=ext4\n" >> ${system_dlkm_props_file}
        echo -e "use_dynamic_partition_size=true\n" >> ${system_dlkm_props_file}
        echo -e "ext_mkuserimg=mkuserimg_mke2fs\n" >> ${system_dlkm_props_file}
        echo -e "ext4_share_dup_blocks=true\n" >> ${system_dlkm_props_file}

        build_image "$DLKM_STAGING_DIR" "${system_dlkm_props_file}" "$OUT/system_dlkm.img" /dev/null
        avbtool add_hashtree_footer \
            --partition_name system_dlkm \
            --image "$OUT/system_dlkm.img"

        SYSTEM_DLKM_SHA256=$(sha256sum "$OUT/system_dlkm.img" | cut -d' ' -f1)
        echo "system_dlkm_sha256=${SYSTEM_DLKM_SHA256:-ERROR}" >> "$GITHUB_OUTPUT"

        cp "$OUT/system_dlkm.img" "$ARTIFACTS_DIR"
        cp "$OUT/system_dlkm.modules.load" "$ARTIFACTS_DIR"
        cp "$OUT/system_dlkm.modules.load" "$ARTIFACTS_DIR_DEBUG"

    - name: Format build time
      id: build_time
      shell: bash
      run: |
        set -euo pipefail
        if [ "$duration" -ge 60 ]; then
          duration="$((duration / 60))m $((duration % 60))s"
        else
          duration="${duration}s"
        fi
        echo "duration=$duration" >> "$GITHUB_OUTPUT"

    - name: Final Build Summary
      shell: bash
      run: |
        set -euo pipefail
        SUM_HEAD="🎯 **${MODEL}** — ${KERNEL_FULL_VER} · ${{ inputs.ksu_type }} ${KSUVER:-?}"
        if [ "${{ inputs.use_susfs }}" = "true" ] && [ "${{ inputs.ksu_type }}" = "KSU_NEXT" ]; then
          SUM_HEAD="${SUM_HEAD} · SuSFS ${SUSVER:-?}"
        fi
        if [ "${{ inputs.use_nomount }}" = "true" ] && [ "${{ inputs.ksu_type }}" = "RSKSU" ]; then
          SUM_HEAD="${SUM_HEAD} · NoMount ${NMVER:-?}"
        fi
        SUM_HEAD="${SUM_HEAD} · ⏱ ${{ steps.build_time.outputs.duration }}"

        {
          echo "<details>"
          echo "<summary>${SUM_HEAD}</summary>"
          echo ""
          echo "#### 🎯 Kernel Build Summary"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| **Model** | ${MODEL} |"
          echo "| **Kernel Release** | ${kernel_release} |"
          echo "| **Kernel Uname** | \`${KERNEL_UNAME}\` |"
          echo "| **KSU Type** | ${{ inputs.ksu_type }} |"
          echo "| **KSU Version** | ${KSUVER:-unknown} |"
          echo "| **KSU Commit** | \`${KSUN_COMMIT_SHA}\` |"
          if [ "${{ inputs.use_susfs }}" = "true" ] && [ "${{ inputs.ksu_type }}" = "KSU_NEXT" ]; then
            echo "| **SUSFS Version** | ${SUSVER:-unknown} |"
          fi
          if [ "${{ inputs.use_nomount }}" = "true" ] && [ "${{ inputs.ksu_type }}" = "RSKSU" ]; then
            echo "| **NoMount Version** | ${NMVER:-unknown} |"
          fi
          echo "| **Optimization** | ${{ inputs.optimize_level }} |"
          echo "| **LTO** | ${{ inputs.lto }} |"
          echo "| **Clean Build** | ${{ inputs.clean_build }} |"
          echo "| **Custom Timestamp** | \`${EFFECTIVE_BUILD_TIMESTAMP:-auto}\` |"
          echo ""
          echo "#### 📊 Hashes"
          echo ""
          echo "| Artifact | SHA256 |"
          echo "|----------|--------|"
          echo "| **Kernel Image** | \`${{ steps.collect_kernel_stats.outputs.image_sha256 }}\` |"
          echo "| **Boot Image** | \`${{ steps.create_boot.outputs.boot_sha256 }}\` |"
          echo "| **System DLKM** | \`${{ steps.create_system_dlkm.outputs.system_dlkm_sha256 }}\` |"
          echo ""
          echo "#### 📈 Build Metrics"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| **Warnings** | ${{ steps.collect_kernel_stats.outputs.warnings }} |"
          if [ "${{ inputs.clean_build }}" != "true" ]; then
            echo "| **ccache Hit Rate** | ${{ steps.ccache_stats.outputs.hit_rate }} |"
            echo "| **ccache Direct Rate** | ${{ steps.ccache_stats.outputs.direct_rate }} |"
          fi
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Cleanup old ccache & upload ccache log
      shell: bash
      run: |
        set -euo pipefail
        echo "[DEBUG] Uploading ccache logs"
        if [ -n "${CCACHE_LOGFILE:-}" ] && [ -f "${CCACHE_LOGFILE:-}" ]; then
          cp "$CCACHE_LOGFILE" "$ARTIFACTS_DIR_DEBUG" || true
        fi

        if [ "${{ inputs.clean_build }}" != "true" ]; then
          ccache_end=$(date +%s)
          ccache_delta=$(( ccache_end - ccache_start ))
          if [[ "${{ inputs.evict_unused_ccache }}" == "true" ]]; then
            echo "[DEBUG] Deleting ccache contents older than $ccache_delta seconds"
            ccache --evict-older-than "${ccache_delta}s" || true
          fi

          echo "[WARNING] Deleting old LTO cache..."
          gh cache delete LTO-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }} || true

          echo "[WARNING] Deleting old ccache..."
          gh cache delete ccache-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }} || true
        fi

    - name: Purge old mixed artifacts
      if: ${{ env.BUILD_TYPE == 'Mixed Build' || env.BUILD_TYPE == 'Kernel Only' }}
      shell: bash
      run: |
        gh cache delete ${{ env.MODEL }}-MIXED-TREE-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }} || true

    - name: Save ccache
      if: ${{ inputs.clean_build != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}-${{ inputs.lto }}_LTO

    - name: Save LTO cache
      if: ${{ inputs.lto == 'Thin' && inputs.clean_build != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.LDCACHE_DIR }}
        key: LTO-${{ env.MODEL }}-kernel-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}

    - name: Save files for Mixed builds
      if: ${{ env.BUILD_TYPE == 'Mixed Build' || env.BUILD_TYPE == 'Kernel Only' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.KBUILD_MIXED_TREE_DIR }}
        key: ${{ env.MODEL }}-MIXED-TREE-${{ inputs.optimize_level }}-${{ env.KERNEL_FULL_VER }}

    - name: Upload Artifacts
      if: success() && steps.create_zip.conclusion == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ env.MODEL }}
        path: ${{ env.CONFIG }}/artifacts/

    - name: Upload Debug zip
      uses: actions/upload-artifact@v4
      with:
        name: debug-common-${{ env.MODEL }}
        path: ${{ env.CONFIG }}/debug/artifacts/